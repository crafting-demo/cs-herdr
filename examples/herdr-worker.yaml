---
# herdr-worker -- example Crafting template for Herdr.
#
# Created by `./setup.sh --example`. Starting point, not a contract: edit it,
# or point cs-herdr at another template with `cs herdr set-template NAME`.
#
# A Herdr worker needs two things:
#
#   1. `herdr` already installed. Remote attach is a ProxyCommand, so Herdr
#      cannot prompt to install itself. Doing it at create time also pays the
#      cost once per pooled sandbox, not on first attach.
#
#   2. `herdr server` running as owner, as a session leader
#      (`setsid -f -w herdr server`). That keeps agents alive after detach.
#      Without setsid, `herdr --remote` thinks the server will die on SSH loss
#      and prompts to restart it on every attach.
#
workspaces:
  - name: dev
    description: Herdr worker -- runs the herdr server and the coding agents inside it.

    # Public image with node, which the agent CLIs below need. Swap freely.
    base_snapshot: oci://us-docker.pkg.dev/crafting-eng/pub/sandbox/workspace/default:latest

    env:
      - SHELL=/bin/bash
      - PATH=/usr/local/go/bin:/usr/local/node/bin:$HOME/.local/bin:$PATH
      - XDG_CONFIG_HOME=$HOME/.config   # herdr config, logs, session state
      - TERM=xterm-256color             # agents inherit this; some refuse colour without it

      # Uncomment secrets your org has. Pooled sandboxes are created before
      # anyone claims them, so device login cannot work.
      #   cs secret create anthropic-api-key --value ...
      #
      # - ANTHROPIC_API_KEY=${secret:anthropic-api-key}
      # - OPENAI_API_KEY=${secret:openai-api-key}

    checkouts:
      # Swap the repo, or drop this and clone by hand. Keep the daemon block:
      # checkout daemons run as owner. A `system:` daemon runs as root, and
      # Herdr would then put its socket in root's home -- you'd attach as
      # owner and get an empty second server. If you delete this checkout,
      # move the daemon onto whichever checkout remains.
      - path: hello
        repo:
          git: https://github.com/crafting-test1/hello
        manifest:
          overlays:
            - inline:
                daemons:
                  herdr-server:
                    run:
                      # Build can finish before on_create installs herdr.
                      cmd: |
                        for _ in $(seq 1 120); do
                          [ -x "$HOME/.local/bin/herdr" ] && break
                          sleep 5
                        done
                        # Session leader so herdr --remote does not prompt.
                        # -w keeps this process alive for Crafting to supervise.
                        exec setsid -f -w "$HOME/.local/bin/herdr" server
                      dir: /home/owner   # not this checkout; the server outlives the project
                      env:
                        - TERM=xterm-256color

    lifecycle:
      on_create:
        run:
          # Once per sandbox, as owner, including pooled ones.
          cmd: |
            set -eu

            curl -fsSL https://herdr.dev/install.sh | sh

            # Trim to the agents you use; each one costs pool build time.
            npm install -g @anthropic-ai/claude-code --prefix "$HOME/.local" || true
            npm install -g @openai/codex --prefix "$HOME/.local" || true

            # Native session restore on resume. Install only for agents above.
            "$HOME/.local/bin/herdr" integration install claude || true
            "$HOME/.local/bin/herdr" integration install codex || true
        timeout: 900s
        max_retries: 2

customizations:
  # Keep processes across standby so a claim does not restart herdr (and its panes).
  - detach_env:
      enabled: true
