---
# herdr-worker -- an example Crafting template for running Herdr.
#
# Created by `./setup.sh --example` if you have no template of your own. It is
# a starting point, not a fixed contract: edit it, or point cs-herdr at any
# template you already have with `cs herdr set-template NAME`.
#
# A template is a Herdr worker if it satisfies two requirements:
#
#   1. the `herdr` binary is already installed.
#
#      Herdr can install itself onto a remote host, but it asks first, and
#      declines when it cannot ask. An SSH ProxyCommand is not a terminal it
#      can ask through, so an attach against a bare sandbox fails at platform
#      detection instead of prompting. Installing at create time also means the
#      cost is paid once per pooled sandbox rather than on every first attach.
#
#   2. `herdr server` is running as a daemon, as the owner user.
#
#      This is what makes an agent outlive you. The server owns the panes, so
#      agents keep working after you detach, close the laptop, or lose the
#      network -- and the session is there to come back to even if nobody has
#      attached to this sandbox yet.
#
workspaces:
  - name: dev
    description: Herdr worker -- runs the herdr server and the coding agents inside it.

    # A public image that ships node, which the npm-installed agent CLIs below
    # need. Swap in your org's own base image; nothing here depends on this one
    # beyond node being present.
    base_snapshot: oci://us-docker.pkg.dev/crafting-eng/pub/sandbox/workspace/default:latest

    env:
      - SHELL=/bin/bash
      - PATH=/usr/local/go/bin:/usr/local/node/bin:$HOME/.local/bin:$PATH
      # Herdr keeps its config, logs and session state here.
      - XDG_CONFIG_HOME=$HOME/.config
      # Agents inherit this from their pane, and several of them render
      # differently (or refuse colour) without it.
      - TERM=xterm-256color

      # Agent credentials.
      #
      # Uncomment the ones your org has secrets for. These come from org
      # secrets rather than a device login on purpose: a pooled sandbox is
      # created before anyone claims it, so there is nobody present to complete
      # an interactive sign-in, and a warm sandbox that needs a login before it
      # is useful is not warm.
      #
      # Create them with:  cs secret create anthropic-api-key --value ...
      #
      # - ANTHROPIC_API_KEY=${secret:anthropic-api-key}
      # - OPENAI_API_KEY=${secret:openai-api-key}

    checkouts:
      # Your project. Swap in your own repo, or drop this and clone by hand
      # once attached.
      #
      # The herdr server daemon is attached to this checkout rather than
      # declared under `system:`. Both start a background process, but a
      # workspace-level system daemon runs as root, and Herdr would then put
      # its socket and session state in root's home while you attach over SSH
      # as `owner` -- you would get an empty second server instead of your
      # agents. Daemons declared on a checkout run as the owner, which is the
      # identity that has to own the panes.
      #
      # Keep the daemon block if you replace the repo below. If you delete the
      # checkout entirely, move the daemon onto whichever checkout remains.
      - path: hello
        repo:
          git: https://github.com/crafting-test1/hello
        manifest:
          overlays:
            - inline:
                daemons:
                  herdr-server:
                    run:
                      # Daemons start once the build completes, which can be
                      # before on_create has finished installing Herdr. Waiting
                      # for the binary rather than assuming it keeps the daemon
                      # from failing its first start and backing off.
                      cmd: |
                        for _ in $(seq 1 120); do
                          [ -x "$HOME/.local/bin/herdr" ] && break
                          sleep 5
                        done
                        exec "$HOME/.local/bin/herdr" server
                      # The server outlives any one project, so it runs from
                      # home rather than from this checkout.
                      dir: /home/owner
                      env:
                        - TERM=xterm-256color

    lifecycle:
      on_create:
        run:
          # Runs once per sandbox, as owner, in the home directory -- including
          # for each sandbox a warm pool builds ahead of time, so a claim is
          # usable the moment it lands.
          cmd: |
            set -eu

            # Herdr's installer puts the binary in ~/.local/bin, which is on
            # PATH above.
            curl -fsSL https://herdr.dev/install.sh | sh

            # The coding agents. Trim this to the ones you use; every one of
            # them adds to the build time of every pooled sandbox.
            npm install -g @anthropic-ai/claude-code --prefix "$HOME/.local" || true
            npm install -g @openai/codex --prefix "$HOME/.local" || true

            # Integrations give Herdr native session restore for an agent, so a
            # resumed sandbox brings the agent's own conversation back rather
            # than only replaying the terminal it left behind. Install only the
            # ones whose agent is actually installed above.
            "$HOME/.local/bin/herdr" integration install claude || true
            "$HOME/.local/bin/herdr" integration install codex || true
        timeout: 900s
        max_retries: 2

customizations:
  # Leave processes running when the sandbox goes to standby, so a claimed or
  # resumed sandbox is usable immediately instead of restarting the herdr
  # server -- which would take the agents' panes with it.
  - detach_env:
      enabled: true
